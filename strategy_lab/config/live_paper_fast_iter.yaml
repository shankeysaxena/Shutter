# Fast-Iteration Live Paper Config — Phase 5B
#
# Goal: increase trade frequency for faster live-paper feedback.
#       Collect enough data weekly to make enable/disable decisions.
#
# Weekly decision rules:
#   PF > 1.1  with 10+ trades  → keep / increase confidence
#   PF 0.9–1.1                 → continue observing
#   PF < 0.8  with 10+ trades  → disable candidate
#   kill switch hit             → disable for next week unless explained
#   < 5 trades/week             → insufficient data
#
# Run:
#   python3 -m src.cli.main live-paper run \
#       --config config/live_paper_fast_iter.yaml \
#       --policy fast_iter_allocator \
#       --shadow-config config/shadow_allocator_validation.yaml \
#       --shadow vwap_pullback_only deterministic_no_orb fast_iter_allocator all_on

experiment_name: live_paper_fast_iter

live:
  max_stale_minutes: 5    # catches silent TCP hangs faster

runtime:
  mode: backtest    # used by main.py regression runs; live-paper CLI ignores this

instruments:
  - NIFTY
  - BANKNIFTY

costs:
  slippage_per_side: 2.0
  brokerage_per_trade: 20.0

risk:
  mode: fixed_lot
  lot_size:
    NIFTY: 25
    BANKNIFTY: 15
  max_total_trades_per_day: 3

risk_engine:
  daily_loss_cap: -5000
  per_strategy_loss_cap: -3000
  max_open_positions: 2
  max_trades_per_session: 3
  cooldown_after_losses: 3
  cooldown_minutes: 30
  strategy_kill_switch:
    consecutive_losses: 10

session_validation:
  enabled: false
  policy: warn

strategies:
  # ── Active strategies ──────────────────────────────────────────────
  vwap_pullback:
    enabled: true
    no_entry_after: "13:30"
    max_trades_per_day: 2
    target_r: 2.0
    min_trend_bars: 3
    pullback_zone_pct: 0.003

  vwap_reversion:
    enabled: true
    stretch_threshold_atr: 1.5
    min_bars_stretched: 2
    min_reversal_ratio: 0.25
    max_stretch_bars: 30
    no_entry_after: "13:30"
    max_trades_per_day: 2
    stop_mode: hybrid_atr
    atr_stop_multiplier: 0.75
    stop_buffer_pct: 0.0008

  or_failure_fade:
    enabled: true
    max_failure_bars: 5
    stop_buffer_pct: 0.0003
    target_type: vwap
    no_entry_after: "13:30"
    max_trades_per_day: 1       # tighter: 504→37 trades confirmed with gap+VWAP filter
    stop_mode: hybrid_atr
    atr_stop_multiplier: 0.75
    min_gap_pct: 0.005          # gap filter: exhaustion requires overnight imbalance
    min_or_width_pct: 0.000
    require_vwap_reclaim: true  # VWAP reclaim confirms genuine trap, not chop

  compression_breakout:
    enabled: true               # v2: allocator detects range, strategy watches breakout only
    entry_start: "10:00"
    no_entry_after: "15:00"
    max_overshoot_ratio: 0.5    # skip entry if bar closed > 50% of comp_range past breakout level
    atr_stop_multiplier: 1.0    # stop = entry ± 1× ATR
    atr_target_multiplier: 2.0  # target = entry ± 2× ATR → 2:1 R:R
    min_atr: 12.0               # NIFTY compression has ~5-6pt ATR (costs kill P&L); BANKNIFTY ~20pt
    max_trades_per_day: 1

  # ── Disabled strategies ────────────────────────────────────────────
  orb:
    enabled: false              # structurally weak — research only

  gap_behavior:
    enabled: false              # no confirmed edge

  iron_fly:
    enabled: false              # not validated on real option chains

option_chain_feed:
  type: synthetic
  synthetic:
    atm_iv: 0.15

multi_leg_simulator:
  mode: realistic
