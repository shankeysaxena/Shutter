experiment_name: phase4_orb_vwap_gap_synthetic

runtime:
  mode: backtest   # backtest | replay

instruments:
  - NIFTY
  - BANKNIFTY

date_range:
  start: null    # null = use earliest date in the data file
  end: null      # null = use latest date in the data file

costs:
  slippage_per_side: 2.0
  brokerage_per_trade: 20.0

risk:
  mode: fixed_lot
  lot_size:
    NIFTY: 25
    BANKNIFTY: 15
  max_total_trades_per_day: 4

session_validation:
  enabled: true
  min_bars: 300
  max_bars: 376
  warn_missing_minutes: true
  policy: warn   # warn | fail | skip

output:
  save_event_log: false

strategies:
  orb:
    enabled: true
    opening_range_start: "09:15"
    opening_range_end: "09:30"
    no_entry_after: "12:00"
    target_r: 2.0

  vwap_pullback:
    enabled: true
    no_entry_after: "13:30"
    max_trades_per_day: 2
    target_r: 2.0
    min_trend_bars: 3
    pullback_zone_pct: 0.003   # 0.3% from VWAP counts as "in pullback zone"

  # VWAP Mean Reversion — Phase 4.8C
  # Fades price that has stretched too far from VWAP; targets reversion back to VWAP.
  # Suited for range-bound / mean-reverting regimes where ORB fails.
  vwap_reversion:
    enabled: true
    stretch_threshold_atr: 1.5   # how many ATR units from VWAP = "stretched"
    min_bars_stretched: 2        # must hold stretch for ≥ N bars before signaling
    min_reversal_ratio: 0.25     # close must retrace ≥ 25% of peak distance to trigger
    max_stretch_bars: 30         # give up if no reversal within this many bars
    no_entry_after: "13:30"
    max_trades_per_day: 2
    # Phase 4.9B sweep result: 0.75 mult is best (-Rs16k vs -Rs47k original).
    # Geometry improved (R:R 0.52 → 1.14) but still negative.
    # Conclusion: entry too close to VWAP. Fix: deeper stretch threshold (2.0+).
    # Do NOT change entries yet — record this as the next research item.
    stop_mode: hybrid_atr
    atr_stop_multiplier: 0.75
    stop_buffer_pct: 0.0008

  # OR Failure Fade — fades failed Opening Range breakouts back to VWAP
  # Complementary to ORB: activates on the same sessions where ORB loses
  # Wide OR days (>0.6%) are the primary target — R:R improves as OR widens
  or_failure_fade:
    enabled: true
    max_failure_bars: 5        # bars before declaring the break a real breakout
    stop_buffer_pct: 0.0003    # ~6 pts on NIFTY — small enough to preserve R:R
    target_type: vwap          # vwap | or_midpoint
    no_entry_after: "13:30"
    max_trades_per_day: 2      # one per direction
    # Structural filters — empirically derived from segmentation (2025 data):
    # large gap (>1%) → PF 1.43, 61% WR; flat open → structural drag
    # wide OR (>0.4%) → near breakeven; normal OR dilutes the signal
    # Changing these is parameter tuning — only update with new empirical evidence.
    # Structural filters — disabled pending R:R fix
    min_gap_pct: 0.000
    min_or_width_pct: 0.000
    # Phase 4.9B: same hybrid ATR stop as VWAP Reversion
    stop_mode: hybrid_atr
    atr_stop_multiplier: 1.0

  gap_behavior:
    enabled: true
    gap_threshold_pct: 0.005   # 0.5% minimum gap to trade
    opening_range_end: "09:30"
    no_entry_after: "12:30"
    target_r: 2.0

  # v2 §11 — off by default; flip per-experiment.
  # Multi-leg strategy: defined-risk Iron Fly on NIFTY/BANKNIFTY weeklies.
  # See Iron_Fly_Strategy_Spec_v2.md for design notes.
  iron_fly:
    enabled: false
    underlyings: [NIFTY, BANKNIFTY]
    allowed_dte: [0, 1, 2]
    event_day_blacklist_0dte: true
    event_days_file: data/event_days.csv
    entry_window_start: "09:45"
    entry_window_end: "13:30"
    trend_filter:
      max_vwap_distance_pct: 0.0025
    range_filter:
      or_width_lookback_days: 20
      max_or_width_vs_median: 1.0
      or_history_min_days: 5            # v2.1 #3 — wired through to strategy
    iv_regime_filter:
      lookback_days: 60
      min_observations: 500             # v2.1 #3 — wired through to strategy
      min_percentile: 0.25
      max_percentile: 0.75
    liquidity_filter:
      max_atm_spread_pct: 0.02
      require_two_sided_wings: true
    wing_width_pct_of_spot: 0.005
    strike_interval:
      NIFTY: 50
      BANKNIFTY: 100
    risk_per_trade_pct: 0.005
    capital: 1000000
    max_lots_per_trade: 10
    lot_size:
      NIFTY: 25
      BANKNIFTY: 15
    exits:
      touch_exit:
        enabled: true
        distance_pct_of_wing: 1.0       # 1.0 = at wing strike (see spec v2 §7.1)
      no_progress:
        # Thresholds DELIBERATELY low until real-chain sweep calibrates them.
        # Spec v1 used 10%/25%; those fire on every trade under round-trip costs.
        enabled: true
        checkpoints:
          - { offset_minutes: 45, min_profit_pct_of_max: 0.01 }
          - { offset_minutes: 90, min_profit_pct_of_max: 0.05 }
      profit_target:
        enabled: true
        pct_of_max_profit: 0.15          # intraday-realistic; NOT hold-to-expiry
      vol_expansion:
        enabled: true
        premium_multiple_threshold: 1.3
        max_spot_move_pct: 0.005
      hard_time_stop: "15:15"
    one_trade_per_underlying_per_day: true

# v2 §11 — only consulted when an options strategy is enabled.
notifications:
  provider: telegram
  min_level: INFO              # INFO | WARNING | CRITICAL
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env:   TELEGRAM_CHAT_ID

risk_engine:
  daily_loss_cap: -15000          # halt session if cumulative P&L drops below this
  per_strategy_loss_cap: -8000    # per-strategy daily halt threshold
  max_open_positions: 4           # total simultaneous open trades
  max_trades_per_session: 20      # hard cap on fills per session
  cooldown_after_losses: 3        # consecutive losses before temporary cooldown
  cooldown_minutes: 30            # cooldown duration
  strategy_kill_switch:
    consecutive_losses: 10        # permanently disable strategy for session after N losses
                                  # protects against regime decay, runtime corruption, fill degradation

option_chain_feed:
  type: synthetic                        # synthetic | historical
  synthetic:
    atm_iv: 0.15
    skew: -0.02
    smile: 0.30
    risk_free_rate: 0.07
    num_strikes_each_side: 20
    spread_pct: 0.01
    min_spread: 0.5
    expiry_weekday: 3                    # 0=Mon..6=Sun; 3 = Thursday
  historical:
    snapshot_dir: data/option_chain_snapshots
    strict_schema: true                    # fail loudly on schema violations; flip to false to log+continue

multi_leg_simulator:
  mode: realistic                        # ideal | realistic | pessimistic
  tick_size: 0.05
  brokerage_per_leg: 20.0
